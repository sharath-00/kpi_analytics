name: Schnell Gateway KPI Automated Mail Dispatch

on:
  # 1. Triggered automatically via external API call (cURL, Google Apps Script, AppSheet, Postman)
  repository_dispatch:
    types: [send_gateway_kpi_mail, run_gateway_kpi_report]

  # 2. Triggered manually from the GitHub Actions web interface
  workflow_dispatch:

  # 3. Optional: Scheduled automated daily run at 17:40 IST (12:10 UTC)


jobs:
  dispatch-kpi-mail:
    name: Sync Google Sheet & Dispatch Mail Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Google Service Account Key
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SERVICE_ACCOUNT_JSON" ]; then
            echo "$SERVICE_ACCOUNT_JSON" > service_account.json
            echo "Service account key restored successfully."
          else
            echo "Warning: SERVICE_ACCOUNT_JSON secret not found. Checking for committed key..."
          fi

      - name: Sync Google Sheet & Dispatch Email
        env:
          SPREADSHEET_ID_OR_URL: ${{ secrets.SPREADSHEET_ID_OR_URL || '1vgixi02Sj5cAOjjh92DisSDk_PsxyskOPdEI6j1VaH8' }}
          WORKSHEET_NAME: ${{ secrets.WORKSHEET_NAME || 'Gateway' }}
          SERVICE_ACCOUNT_FILE: service_account.json
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
        run: |
          python sync_google_sheet.py --send
